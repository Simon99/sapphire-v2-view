RACG 綜述（Tao et al. 2026, arXiv:2510.04905）是 Repository-level Retrieval-Augmented Code Generation 的首篇全覆蓋綜述，152 篇，建立 non-graph-based vs. graph-based 二元範式。其演進敘事：從 BM25 被動匹配 → structure-aware graph retrieval → agentic command-driven search（LLM 主動決定 what/when/where to retrieve），Claude Code 等系統以 grep/ls/cat terminal commands 替換靜態 embedding index 是最具代表性的 emerging trend（§4.1.2）。Level 2 agentic 系統（SWE-agent/OpenHands/Claude Code）表現最強，但 Level 0 系統（Agentless）在 SWE-bench Lite 仍達 32%，複雜 agentic workflow 並非總是必要的（§5.2.3）。Bhati 2026（arXiv:2604.26275）則以六層參考架構（L0–L5）整合工業與學術系統，量化 SWE-bench 從 1.96%（2023 年 10 月）到 78.4%（2026 年 4 月）的完整軌跡，確認增長主要由 scaffolding 設計而非 raw model capability 驅動。

**落差：** 這批綜述一致指出，repository-level 漸進演化（incremental commit-level）、多語言代碼庫、非功能性維護指標（maintainability、security、technical debt）至今仍是系統性研究空白。

---

### H2 — Agent 採用實證：生產力與代碼品質的張力

這是 H 類最具影響力的主線，多篇論文使用因果推斷或大規模觀察設計，對「coding agent 到底帶來了什麼」給出量化答案，結論遠比行銷話術複雜。

**採用率基線**：Robbes et al. 2026（arXiv:2601.18341）對 128,018 個 GitHub 開源專案的大規模觀察，估計截至 2026 年 2 月 coding agent 採用率達 22–28%。採用加速有兩個明確節點：Claude Code 初次發布（2025 年 2 月末）與 Codex/Gemini/Jules 集中發布（2025 年 5 月中旬）。貢獻類型分布意義重大：Claude Code 提交中 feat（35.7%）與 fix（29.9%）佔三分之二，chore 僅 7.1%——與人類 chore 31%、fix 27%、feat 17% 的分布形成鮮明對比，確認 coding agent 主要用於「建功能、修 bug」而非長期維護雜務（§10.3）。Robbes et al. 2026（arXiv:2601.18345）同組的方法論論文指出 MSR 研究的五項承諾與八項陷阱，其中「部分可觀察性困境」最關鍵：超過 40% 有 agent 跡象的專案在 commit 層面沒有任何標記。

**速度增益**：He et al. 2026（arXiv:2511.04427）對 806 個 GitHub 開源專案的 staggered DiD 研究，發現採用 Cursor 後 Lines Added 顯著增加 +28.6%，但增益集中於採用後 1–2 個月（第 1 個月 +281.3%，第 2 個月 +48.4%，之後回歸 baseline）。Agarwal et al. 2026（arXiv:2601.13597）聚焦 autonomous coding agent（Claude Code、Devin、Cursor Agent）的更大規模研究，AF（agent-first，401 個倉庫）顯示持續速度增益：commits +36.25%、lines added +76.59%，動態效果於 t=6 仍維持 +49–109%。但 IF（IDE-first，已有 AI IDE 的倉庫）速度增益接近零，顯示邊際效益在已有 AI 輔助的環境中大幅萎縮。

**代碼品質惡化**：這是兩項研究最一致的警示信號。He et al. 2026 發現 Cursor 採用後 Static Analysis Warnings +30.3%、Code Complexity +41.6%，且此效應在採用後超過 6 個月仍持續。進一步的 Panel GMM 分析揭示惡性循環機制：Cursor 採用 → Code Complexity 上升 → 下期 Lines Added 下降（−0.718, p<0.001），技術債累積反噬未來開發速度（§4.2）。Agarwal et al. 2026 複製並擴展此發現：autonomous agent 採用後 static warnings AF +17.73%/IF +19.00%，cognitive complexity AF +34.85%/IF +42.87%，且即使速度增益消退後，complexity 仍持續升高（§4）。

**PR 接受率與後續維護**：Watanabe et al. 2025（arXiv:2509.14745）對 567 個 Claude Code PR 的分析顯示接受率 83.8%，低於人工 PR 91.0%（p<0.05）；但拒絕原因主要是「alternative solutions」（12.0%）與「oversized PRs」（3.3%），技術缺陷僅 2.2%——顯示品質問題並非拒絕主因。Sayagh et al. 2025（arXiv:2512.21426）從 issue 品質角度切入，發現高品質 issue（scope 明確、self-contained）的 Copilot PR 合併率達 77.11%，比低品質 issue 高 31.2%；scope 特徵正向影響合併率 16.44%，而涉及外部依賴的 issue 則負向影響 6.91%。Sawada et al. 2025（arXiv:2605.06464）追蹤六個月後 AI 生成檔案的維護情況：AI 生成檔案第一個月 commit 次數約為人類的一半，但長期維護需求仍持續；維護類型偏 feat（21.78%），人類更多做 fix（16.76%）和 docs（16.22%），顯示 AI 代碼的維護需求結構不同。

**工業案例**：Cihan et al. 2024（arXiv:2412.18531）對 Beko 企業 4,335 個 PR 的縱向案例研究，CodeReviewBot（GPT-4 Turbo）評論接受率 73.8%，PR 關閉時間整體增加（+2h28m），但三個專案趨勢相反（有正有負），人工審查量未顯著減少——自動化工具在工業場景的效益高度依賴組織文化與既有流程，不能照搬實驗室結論。

**張力歸納：** 速度提升（短期明顯）vs. 品質惡化（持續且自我強化）是 H2 最核心的張力。更精微的是，速度增益在已有 AI 輔助的環境中趨近消失（diminishing returns），但品質惡化跨 AF/IF 均存在，是更穩健的效應。

---

### H3 — Agent 安全實證：從 Patch 漏洞到 CI/CD 攻擊面

這條主線揭示 agentic coding 帶來的安全新風險，由多篇量化實証研究構成。

**Patch 安全性**：Sajadi et al. 2025（arXiv:2507.02976）使用三個 OWASP 工具分析 SWE-bench 上 LLM patch 的安全風險，發現 Llama 3.3 引入的新漏洞是開發者的 11 倍（135 vs. 12）。漏洞類型有 LLM 特有模式：CWE-95（Eval Injection，39 次）、CWE-502（Insecure Deserialization，17 次）在開發者 patch 幾乎不存在，顯示 LLM 並非只是重複人類錯誤，而是引入全新的風險模式。Agentic 框架中，OpenHands 引入 195 個潛在漏洞（人工驗證後 44 個），最極端案例產生 500,000+ 行 diff；ACR 和 HC 則各 2–3 個，顯示框架設計差異巨大（§3.2）。

**FCV-Attack 揭示功能正確 ≠ 安全**：Peng et al. 2025（arXiv:2510.17862）首次系統化描述 Functionally Correct yet Vulnerable（FCV）patch 威脅。無攻擊時，四個主流模型的功能正確 patch 已有 4.3–6.0% 含漏洞（乾淨背景率）。FCV-Attack 以 black-box、single-query 方式將 CWE 目標指令注入 issue 描述，對全部 12 個 agent–model 組合均有效，Attack Success Rate 達 18.1%–62.9%；CWE-538（sensitive info 寫入 log）最易被利用（ASR 平均 36.8%），因為 agent 被訓練為「helpful」，習慣性加入 logging 指令。更令人警惕的是：更強的模型 = 更高的 ASR（Claude Sonnet 4 平均 14.0%），強指令遵循能力使模型更易依從惡意指令；且 prompt-level 防禦效果有限，ASR 只降低 2–11 個百分點（§6.3）。

**大規模 AIGCode 生態安全**：Wang et al. 2025（arXiv:2512.18567）對 Top 1000 GitHub 開源倉庫（2022–2025）的分析，確認 AI 在漏洞生命週期中的淨影響為正（fix 比例 > introduction 比例），但 AI 引入漏洞中網路攻擊向量佔 86.8%（人類 80.8%），且 CWE 類型集中於輸入驗證與不安全 API 調用（§6.1–6.3）。

**CI/CD 新攻擊面**：Wang et al. 2025（arXiv:2605.07135）提出 Agentic Workflow Injection（AWI）概念，以 TAINTAWI 靜態分析框架在 13,392 個 GitHub Actions agentic workflows 中發現 343 個 zero-day 漏洞（確認率 95.6%），僅 21/1,033 個（2.0%）action 提供 access control，絕大多數 agentic workflows 缺乏有效防護（§VI-B, D）。

**Prompt Injection SoK**：Maloyan et al. 2026（arXiv:2601.17548）系統化 42 種攻擊技術，所有 12 種防禦在 adaptive attack 下 bypass rate 達 78%–93%，核心限制是架構性的：LLM 無法可靠區分 instructions 與 data，且 Capability-Security tradeoff 無法迴避——更有能力的 agent 需要更廣泛的外部資源存取，攻擊面必然擴大（§VIII-A）。

**漏洞偵測研究回顧**：Sheng et al. 2025（arXiv:2502.07049）系統分析 58 篇 LLM-based 漏洞偵測研究，核心發現：83% 研究集中在孤立程式碼片段，repository-level dataset 嚴重不足；CoT prompting 是 >10B 大模型的主流，但 GPT-4 雖識別漏洞位置卻常誤判根因；PEFT（LoRA fine-tuned CodeLlama）F1 接近 0.9 是目前最強偵測結果。

**LLMware 供應鏈授權衝突**：Wang et al. 2026（arXiv:2602.10758）對 LLM 軟體供應鏈的授權分析顯示 52% 供應鏈存在至少一處授權衝突，AI-specific 授權（LLAMA2、OpenRAIL++）理解困難是主因，LiAgent 的 multi-agent 偵測框架達 F1=89%（§4.4.3）。

**張力歸納：** 功能正確性（pass@k）掩蓋安全風險是 H3 的核心張力。基準評估越成功，越可能產生「功能正確但暗藏漏洞」的 patch；而更強能力的模型反而更容易遵從惡意指令，形成能力-安全的反向耦合。

### H4 — 過程與行為分析：從失敗模式到效率工具

這條主線深入 agent 執行黑箱，分析過程層面的行為特徵與失敗機制。

**Agent 生成 Patch 品質全面評估**：Chen et al. 2024（arXiv:2410.12468）對 10 個頂尖 agent 在 SWE-Bench Verified 500 issue 的 4,892 個 patch 分析，最關鍵發現是：34% issues 無法被任何 agent 解決（170 個）；只有 5.8% 的 issues 被全部 10 個 agent 解決，互補性強。代碼品質方面，resolved issues 的 code smells 改善達 large effect size，reliability 大多維持穩定，0 個安全漏洞被引入或移除——但 SWE-bench unit test 覆蓋不足，agents 常修改與 gold patch 不同的 files/functions 但仍通過測試（Finding 2, §IV.B）。Resolved vs. Unresolved issues 特徵差異顯著：resolved issues 涉及更少文件（1.09 vs. 1.51）、更小 codebase（569 vs. 1087 行）、更低 complexity（192 vs. 303）（Table IX）。

**解題過程的錯誤動態**：Chen et al. 2026（arXiv:2503.12374）分析 8 個 agent 的 3,977 條 solving trajectories，發現錯誤頻次與解題率高度負相關：1–2 個錯誤的 resolution rate 58.6%，20+ 個降至 22.6%（r=0.59, p<0.001）。環境層（OSError 失敗率 80%）和資料庫層（sqlite3.IntegrityError 77.78%）的錯誤比邏輯層更難修復。還發現 3 個 SWE-Bench 平台 bug，均已回報並獲確認（§7.4）。

**Multi-hunk 修復行為深度分析**：Nashid et al. 2025（arXiv:2511.11012）對 372 個 Java multi-hunk bugs 的四 agent 評估，Claude Code 修復準確率 93.28%，Codex 87.10%，Gemini-cli 41.67%，Qwen Code 25.81%。三個行為模式被辨識：over-modification without validation（Gemini-cli），over-exploration without action（Claude Code），NAVIGATE 過度（Qwen Code）。Regression Reduction 方差差異更大：Gemini-cli 最壞情境可破壞 488 個測試，Claude Code 最壞僅 18；MAPLE MCP tool 對弱 agent 提升顯著（Gemini +30% 修復），但對強 agent 效益有限（§4.9）。

**測試撰寫行為：過程工具而非成功驅動力**：Chen et al. 2026（arXiv:2602.07900）對 6 個最強模型 3000 條 trajectories 的分析揭示：GPT-5.2 幾乎不寫測試（0.6%）卻達 71.8% resolution rate，Claude Opus 4.5 寫 83% 卻只高 2.6 個百分點。Prompt 介入實驗進一步確認：鼓勵/抑制寫測試對 resolution rate 無顯著影響（McNemar p > 0.05），但對 token 消耗影響顯著（Kimi K2 input tokens 降 49%）。結論是：agent 寫測試是「習得的軟體開發慣例」而非解題利器，主要作為 runtime 中間值觀察工具（value-revealing prints 主導，佔 ~70%）。

**實際 PRs 行為**：Haider et al. 2026（arXiv:2601.19287）分析 3,177 個 agent-generated PR 的 19,450 條審查意見，發現：功能正確性（feat，38.9%）是最主要審查主題；安全問題（secu）和建置問題（build）在被拒 PR 中顯著較高（p<0.01/0.05）——這些是阻礙合併的關鍵障礙；文件（doc）和風格（style）審查在成功 PR 中更多，是可解決的建設性反饋。

**工具支援**：AgentStepper（Hutter et al. 2026, arXiv:2602.06593）提出首個 LLM 軟體開發 agent 互動式 debugger，bug identification 成功率從 17%（log+VSCode 控制組）提升至 60%（AgentStepper 組），NASA TLX 挫敗感從 5.4 降至 2.4（/7.0）。TrajAudit（Wang et al. 2025, arXiv:2605.26563）以 investigator agent + Semantic Saliency Folding，將長軌跡（>80 步）失敗定位準確率從 31.9%（All-at-Once baseline）提升至 56.6%，同時 token 消耗比 Step-by-Step 低 6–12 倍。Multi-agent dataset adaptation 研究（Chen et al. 2025, arXiv:2511.21380）更揭示極端場景下的限制：8 個測試案例中只有 1 個完全成功，Step 2（代碼正確性）是最大瓶頸，reference code 作為 Prompt 2 可將結構相似度從 7.25% 提升至 67.14%。

**代碼幻覺的體系性分析**：Zhang et al. 2025（arXiv:2409.20550）以 CoderEval 230 個 Python 任務、六個 LLM 手工標注，建立首個倉庫級代碼幻覺分類體系：Task Requirement Conflicts（43.53%）、Factual Knowledge Conflicts（31.91%）、Project Context Conflicts（24.56%）。RAG 緩解（RepoCoder）對六個模型均有提升，但幅度有限（+0.87%–+3.05% Pass@1），原因在於四個根本限制：訓練資料品質、意圖理解能力、知識截止、倉庫上下文 token 限制。

**AGENTS.md 效率研究**：Lulla et al. 2026（arXiv:2601.20404）以 paired design 對 124 個 PR task 的受控實驗發現：有 AGENTS.md 時 output token 降 20.08%、wall-clock 降 20.27%（p<0.05），說明 repository 級指令檔透過預告結構慣例，有效減少 agent 的探索開銷。

---

### H 類演進方向與落差

**演進軌跡**：H 類論文的時間分布清楚呈現三波演進。第一波（2023–2024 中）以大型綜述建立基礎分類體系（LLM4SE taxonomy、agent 框架、benchmark 生態）。第二波（2024 後半–2025）以 SWE-bench 為錨點，進行 agent 效果的多維評估（品質指標、失敗模式、安全性）。第三波（2025–2026 初）進入工業 field study（企業案例、大規模採用率、因果推斷），並開始關注 agent 行為工具化（debugger、diagnosis framework、指令檔效率）。

**關鍵張力**：
- **速度 vs. 品質**：兩篇獨立的 quasi-experimental DiD 研究均確認代碼品質持續惡化（complexity +34–41%，warnings +17–30%），且惡化效應比速度效益更持久。
- **功能正確性 vs. 安全性**：FCV-Attack 與 Sajadi et al. 顯示 pass@k 成功不保證安全，且更強的模型/agent 反而可能帶來更高的安全風險。
- **Scaffold 設計 vs. 底層模型**：Jiang et al. 與 Bhati 等多篇確認 backbone 模型能力已超越 scaffold 設計成為主要決定因素，但 scaffold 的安全邊界設計（L5 Governance）仍是最不成熟的一層。
- **Test writing as process vs. 成果**：Chen et al. 2026 對測試撰寫行為的分析解構了「多寫測試 = 解題率更高」的直覺假設。

**未解問題**：
1. Repository-level incremental 演化評估（而非孤立 issue 的靜態快照）尚無系統性 benchmark。
2. AI 生成代碼的長期維護成本（超過六個月觀察期）缺乏充分研究。
3. 安全/隱私 vs. 能力的 tradeoff 在架構層尚無解法（Von Neumann Bottleneck 問題）。
4. 代碼複雜度自我強化的惡性循環如何被主動中斷，缺乏實驗性介入研究。
5. Agent 在大型企業代碼庫（數百萬行、強 code review 流程）的長期影響，觀察研究尚在起步階段。

# 第三部分　橫切議題、Anchor、趨勢與落差

## 3. 橫切議題：Tool Use 與 RL/訓練配方

agent 標配化後，差異化落在「給 agent 什麼工具、怎麼給」與「怎麼訓」。兩條獨立子議題報告：
- **Tool Use 形態（依模型世代解讀）**：多工具堆疊 / 單工具+RL / skill / MCP 的取捨；強模型 + RL 下「工具越少越好」（CodeScout RL 後收斂到只用 \`rg\`+\`sed\`）。詳見 \`subtopic-tooluse.md\`。
- **RL / Post-Training 配方**：reward 設計（execution / localization-F1 / process-PRM）、dataset 準備、每筆格式、資料量 vs model size（RL 1.6K–4K 碾壓 SFT 60K–2M）。詳見 \`subtopic-rl-posttraining.md\`。

## 4. Anchor 分析：兩種「重要」

「全球 cite × 本地 cite」四象限：
- **公認核心**（高全球+高本地）：MAGIS(lc4/gc158)、AutoCodeRover(gc229)、Trae(lc18/gc79)、LingmaAgent(lc12/gc60)、SWE-PolyBench(lc13/gc55)。
- **通用基石**（高全球+低本地）：CodeAgent(gc299 但本地 0)、CodePlan(gc204)、SWT-Bench(gc128)——跨領域紅但非本主題專屬。
- **社群專屬新銳**（高本地+低全球）：Prometheus(lc8/gc9)、ExpeRepair(lc11/gc23)、CGM(lc8/gc27)——**領域內部正形成的下一波共識**，比看全球 cite 更早察覺。
- **長尾**：C/G 類多落此象限。

## 5. 時間趨勢（方向性觀察，非定量結論）

⚠️ 三條限制先講：**(1) 新近偏差**——2026 只到 5 月、越近的論文越易被 search 撈到，2026 的「升」有抓取偏差成分；**(2) 小樣本噪訊**——每期每類絕對數多在個位數~20，佔比擺動易受少數論文影響；**(3) 語料庫非普查**——反映這些子議題的投入消長，非全領域。

按佔比的分期觀察（各期總篇：≤2024=44 / 2025H1=46 / 2025H2=75 / 2026(–05)=79）：

| 大類 | ≤2024 | 2025H1 | 2025H2 | 2026(–05) | 方向 |
|---|---|---|---|---|---|
| F Benchmark | 25% | 32% | 22% | 25% | 穩定骨幹（非爆炸）|
| B 定位檢索 | 22% | 21% | 25% | 15% | 2025H2 達頂後回落 |
| H 實證/survey | 11% | 6% | 13% | 17% | 2026 升 |
| C Migration | 11% | 13% | 16% | 6% | 2025H2 達頂後回落 |
| G 維護任務 | 4% | 8% | 6% | 17% | 2026 跳升 |
| D APR | 6% | 10% | 5% | 7% | 平/噪訊 |
| E Training | 6% | 4% | 8% | 6% | 平 |
| A Agents | 11% | 2% | 2% | 3% | 早期掉、之後低 |

**較站得住的 3 個訊號**：
1. **A（純 agent 框架）2024 後塌縮**：11%→2-3%。2024 那 11% 是早期 MAGIS/HyperAgent/MASAI「搭框架」論文，之後幾乎消失——與 agent 標配化一致。
2. **H（實證/survey）2026 升溫**：6%→17%（絕對數 3→14），且出現專門 survey（issue resolution 175 篇、agentic 126 篇）+ 大量行為/安全實證——反思期訊號最實。
3. **G（維護任務）2026 跳升**：8%→17%，doc/test/type/exception 等長尾任務變多——往 issue-resolution 以外擴張。

**一句話（綁限制）**：本語料庫內，純 agent 框架 2024 後即塌縮；2025 能量集中在「找對 code(B)」與「造評測(F)」；2026 動能轉向「反思(H)」與「長尾維護(G)」。但因新近偏差與小樣本，宜當方向性觀察。

## 6. 業界案例：原始數字（場景差異大，不交叉比較）

各案例應用場景、規模、模型、指標都不同，以下只列原始數字供參，**不做跨案例優劣比較**：

| 案例 | 場景 | 時間 | 模型 | 效益（原文數字）|
|---|---|---|---|---|
| Google 內部遷移 (arXiv:2501.06972) | int32→int64 ID 遷移，5 億+ 行 codebase | 2025-01 | fine-tuned Gemini | ~50% 時間節省 |
| Google 內部遷移（同上）| JUnit3→JUnit4，5,359 檔 / 149K 行 | 2025-01 | fine-tuned Gemini | ~87% AI 產出 commit 未經修改 |
| Google 內部遷移（同上）| Joda→java.time（小範圍）| 2025-01 | fine-tuned Gemini | ~89% 時間節省 |
| RUSTINE (arXiv:2511.20617) | C→safe Rust，23 個真實 C 程式（27–13,200 LoC）| 2025-11 | LLM pipeline | 100% 編譯成功、87% 功能正確 |
| AlphaTrans (arXiv:2410.24117) | Java repo 翻譯，neuro-symbolic | 2024-10 | LLM + 靜態分析 | 見原文（分段翻譯 + 雙重驗證）|
| K³Trans (arXiv:2503.18305) | →Rust，RustRepoTrans 375 任務 | 2025-03 | self-evolving LLM | Pass@1 相對最高 +135.9% |

> 讀法：場景從「5 億行 ID 型別遷移」到「23 個小 C 程式翻 Rust」跨度極大，效益指標也不可共量（時間節省 vs 編譯成功率 vs Pass@1）。**結論不是「migration 只有 X%」，而是「不同場景下 LLM 遷移已有實用價值，但能力與場景強相關，缺乏可共量的成熟度標準」。**

## 7. 落差與機會

| 落差 | 說明 |
|---|---|
| **評測過剩、端到端 SOTA 見頂** | F 有 63 benchmark，issue resolution SOTA 逼近天花板(79.4%)且被 UTBoost/SWE-Bench+ 證部分虛高。再造 Python issue bench 邊際價值低；機會在跨語言、長期演進(SWE-CI)、設計約束(SWE-Shield) |

| **長尾任務各自為政** | type inference/logging/exception/issue-commit linking 各 1-2 篇無統一框架，而這正是工程師日常 |
| **定位可能過度工程化** | GrepRAG(grep 贏 graph)、CTIM-Rover(memory 反降效) 兩反例提示部分複雜方法在追 marginal gain |

## 8. 本地/小模型優化參考（非現行風險項）

以下整理「早期模型缺點 + 外部強化工具」的證據，**定位為「如何優化本地/小模型能力」的參考，而非對當前前沿模型的風險警告**（模型世代已不同）：
- **外部強化工具如何補模型不足**：早期弱模型靠多工具 scaffold(CodeAgent 5 工具)補能力；強模型時代轉為 RL 收斂出最小工具集(CodeScout \`rg\`+\`sed\`、RepoNavigator 單 jump tool)——對「想用小模型省成本」者，RL + 最小工具是路線參考。
- **小模型 RL 能在子任務追上大模型**：CodeScout-4B（1.6K 樣本 RL）localization file-F1 68.52 贏 Qwen3-32B；下游把 issue resolution agent 換上 CodeScout-14B 定位，resolve 13.4%→17.2% 且省 17.46% token——本地化部署的成本參考。
- **早期模型的安全缺點（僅供本地模型訓練時參考，非前沿模型現狀）**：有研究觀察到較弱模型(如 Llama 3.3)的 patch 引入較多新漏洞(arXiv:2507.02976)——這提示「本地/小模型的 repair 需配安全驗證」，但**不可外推為前沿模型的風險**。

## 9. 綜合啟示

1. **agent 已是標配**——賣點要從「我做了 agent」轉為「我的 agent 在哪個具體環節(定位/修補/遷移/檢索)有不可替代貢獻」。
2. **前沿從「能力」轉向「可信」**——能解 79% 之後，問題是這 79% 多少是真的、代價多少。
