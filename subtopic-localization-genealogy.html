## 為什麼要這一節

本子議題正文討論的是 2023–2026 的 LLM 定位方法（B 類 51 篇）。但「定位準不準、評準怎麼定、為何卡在 function/line」這些問題，**答案大半繼承自前 LLM 時代**——評準指標（Acc@k / MAP / MRR）來自 IR 世代、function/line 粒度之難來自 SBFL 世代的老問題、「給對位置也修不對」呼應 APR 世代的既有發現。先把譜系攤開，正文的結論才有座標。

## 世代交棒的三個事實（圖上可見）

1. **≤2014 由「統計/切片 + SBFL」主導**：那時定位＝跑測試 + 算頻譜 + 切片，**前提是「有可跑的測試套件」**。
2. **2015–2022 是 IR、DL、與代碼搜尋的混戰**：bug report→source file 的 IR 路線成熟（MAP/MRR/Acc@k 評準在此定型，**直接被今天的 LLM 定位沿用**）；DL 開始學定位；而「代碼搜尋/檢索」成為**貫穿全程、量體最大的支流**（n 在 2020–22 達 62）。
3. **2024 起 LLM 急速接管 FL 一線**：LLM 世代從 2023 的 7 篇，到 2025–2026 各 26/27 篇，在 FL 類占近半。**本語料庫 B 類正落在最右端「LLM ＋ 代碼搜尋/檢索」的交會處**——它是這條 20 年譜系的當代末端，不是一個獨立新起點。

## 三條「延續」與三處「斷裂」——正文會用到的伏筆

**延續（今天仍吃老本）**
- **評準延續**：今天 LLM 定位報的 Acc@k / Recall@k / MRR / MAP，全是 G2 IR 世代立的尺 → 呼應正文§1「評準怎麼定」。
- **粒度老問題**：SBFL 世代就知道 statement/line 級定位最難、file 級最易 → 呼應正文§3「粒度的代價」。
- **跨語言缺口**：DL 世代的 BuGL（2004.08846）、Java 的 JUGE（2106.07520）早就點出資料偏 Java/Python → 呼應正文§6「語言差異」。

**斷裂（LLM 世代丟掉的前提）**
- **丟掉「測試前提」**：G1 SBFL 依賴可跑測試套件；LLM 世代的「test-free fault localization」（2310.01726）刻意拿掉這前提——能處理沒測試的 repo，但也失去頻譜這個強訊號。
- **從「排可疑度」到「直接生成定位 + patch」**：評估重心從「排名品質」滑向「端到端 resolve」，使定位準確度被 resolve rate 遮蔽（正文§8 的瓶頸論即源於此）。
- **斷裂的代價＝可比性瓦解**：六世代各用各的評準與基準，跨世代比「定位準確度」幾乎無意義——這正是正文反覆強調「不可橫比」的歷史根源。

## caveat
- 503 篇為**檢索候選池**，非逐篇精讀；分代用標題+摘要啟發式，邊界世代（如「LLM 改進 SBFL」）歸於 LLM。
- 絕對量受 arxiv 收錄偏差影響（前 2015 SE 論文多在 ICSE/FSE 紙本、未上 arxiv），故 ≤2014 量偏少，**不代表該世代研究少，而是 arxiv 覆蓋少**。
